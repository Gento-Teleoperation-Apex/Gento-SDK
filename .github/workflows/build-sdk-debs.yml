name: Build SDK Debian Packages

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish generated packages to a GitHub Release"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to publish to when run manually, for example v4.6.0"
        required: false
        type: string
  push:
    tags:
      - "v*"
    paths:
      - "SDK_*/**"
      - "SDK_generate_tools/**"
      - ".github/workflows/build-sdk-debs.yml"

permissions:
  contents: write

jobs:
  build:
    name: Ubuntu ${{ matrix.ubuntu }} ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "22.04", "24.04"]
        arch: ["amd64", "arm64"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Debian package
        run: |
          ./SDK_generate_tools/build_all_debs.sh \
            --ubuntu "${{ matrix.ubuntu }}" \
            --arch "${{ matrix.arch }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: gento-sdk-ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}
          path: dist/**/*.deb
          if-no-files-found: error

  publish:
    name: Publish to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag != '')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets

          find packages -type f -name '*.deb' | sort | while read -r package; do
            relative_path="${package#packages/}"
            artifact_dir="${relative_path%%/*}"
            ubuntu_version="${artifact_dir#gento-sdk-ubuntu}"
            ubuntu_version="${ubuntu_version%-*}"
            package_name="$(basename "${package}" .deb)"
            cp "${package}" "release-assets/${package_name}_ubuntu${ubuntu_version}.deb"
          done

          release_package_count="$(find release-assets -type f -name '*.deb' | wc -l)"
          if [[ "${release_package_count}" -ne 6 ]]; then
            echo "Expected 6 release packages, found ${release_package_count}" >&2
            find release-assets -type f -name '*.deb' | sort >&2
            exit 1
          fi

          find release-assets -type f -name '*.deb' | sort

      - name: Remove old SDK release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} does not exist yet; skipping asset cleanup."
            exit 0
          fi

          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' |
            while read -r asset; do
              if [[ "${asset}" == gento-sdk_*.deb ]]; then
                gh release delete-asset "${RELEASE_TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}" --yes
              fi
            done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: release-assets/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
